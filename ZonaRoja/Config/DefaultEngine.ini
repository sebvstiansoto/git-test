; Configuración principal del motor para ZonaRoja
; Shooter de extracción táctica multijugador

[/Script/EngineSettings.GameMapsSettings]
; Modo de juego predeterminado para todas las partidas de incursión
GameDefaultMap=/Game/Maps/MainMenu/MainMenu
GlobalDefaultGameMode=/Script/ZonaRoja.RaidGameMode
GlobalDefaultServerGameMode=/Script/ZonaRoja.RaidGameMode
; Mapa de transición utilizado durante la carga entre incursiones
TransitionMap=/Game/Maps/Loading/LoadingScreen
bUseClientSideLevelStreamingVolumes=False

[/Script/Engine.RendererSettings]
; Habilitar Nanite para geometría virtualizada de alta densidad
r.Nanite=1
; Habilitar Lumen para iluminación global dinámica y trazado de rayos software
r.Lumen.Reflections.Allow=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.LumenScene.SurfaceCache.MeshCardsMinSize=50
; Virtual Shadow Maps para sombras de alta calidad con Nanite
r.Shadow.Virtual.Enable=1
; TSR (Temporal Super Resolution) como método de antialiasing predeterminado
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
; Deshabilitar motion blur por preferencia táctica (reduce distracción visual)
r.MotionBlur.Max=0
r.MotionBlurQuality=0
; Oclusión ambiental de pantalla
r.AmbientOcclusionMipLevelFactor=0.5
r.AmbientOcclusionMaxQuality=100
; Configuración de profundidad de campo
r.DepthOfFieldQuality=2
; HDR y tono
r.TonemapperFilm=1

[/Script/Engine.CollisionProfile]
; Canales de colisión personalizados para mecánicas del shooter de extracción
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Bullet")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Overlap,bTraceType=True,bStaticObject=False,Name="Interaction")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Visibility_Custom")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Penetration")

; Perfil para balas: bloquea todo excepto peones (las balas atraviesan personajes via daño)
+Profiles=(Name="Bullet",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="Bullet",CustomResponses=((Channel="Pawn",Response=ECR_Overlap)),HelpMessage="Canal de balas para proyectiles")
; Perfil de interacción para objetos recogibles y zonas de extracción
+Profiles=(Name="Interactable",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Interaction",Response=ECR_Overlap)),HelpMessage="Objetos con los que el jugador puede interactuar")

[/Script/Engine.PhysicsSettings]
; Substepping para simulación física más precisa con balística
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6
; Física ragdoll para muertes realistas
RagdollAggregateThreshold=4
; Gravedad estándar
DefaultGravityZ=-980.0
; Amortiguación para objetos físicos del mundo
DefaultLinearDamping=0.01
DefaultAngularDamping=0.0

[/Script/Engine.GameNetworkManager]
; Configuración de red para partidas multijugador tácticas
TotalNetBandwidth=32768
MaxDynamicBandwidth=7000
MinDynamicBandwidth=4000
; Tolerancia de lag para predicción del cliente
MaxClientForcedUpdateDuration=1.0
ServerForcedUpdateHitchThreshold=0.150
ServerForcedUpdateHitchCooldown=0.100
MaxMoveDeltaTime=0.125
bMovementTimeDiscrepancyDetection=True
MovementTimeDiscrepancyMaxTimeMargin=0.25
MovementTimeDiscrepancyMinTimeMargin=-0.25
MovementTimeDiscrepancyResolutionRate=1.0
MovementTimeDiscrepancyForcedCorrection=False

[EnhancedInput.DefaultInputComponentClass]
; Usar Enhanced Input Component como componente de entrada predeterminado
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/EnhancedInput.EnhancedInputWorldSubsystem]
bEnableWorldSubsystem=True

[/Script/Engine.AudioSettings]
; Configuración de audio para MetaSounds
DefaultSoundClassName=/Script/Engine.SoundClass'/Game/Audio/SC_Master.SC_Master'
MaxChannels=64
MaxPrecachePerFrame=1
MaxSources=64

[/Script/Engine.GameSession]
; Sesiones de juego para multijugador
MaxPlayers=12
bRequiresPushToTalk=False
