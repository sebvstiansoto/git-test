; Configuración general del juego ZonaRoja
; Shooter de extracción táctica multijugador

[/Script/Engine.GameSession]
; Máximo de jugadores por sesión de incursión
MaxPlayers=12
bRequiresPushToTalk=False
SessionName=ZonaRoja_Session

[/Script/Engine.GameEngine]
; Nombre del proyecto
GameSingletonClassName=/Script/Engine.GameSingleton
DefaultBlueprintBaseClassName=None

[/Script/EngineSettings.GeneralProjectSettings]
; Información del proyecto
ProjectID=+PROJECT_ID+
ProjectName=ZonaRoja
ProjectDisplayedTitle=NSLOCTEXT("ZonaRoja","ProjectDisplayedTitle","Zona Roja")
ProjectVersion=0.1.0
CompanyName=ZonaRoja Studio
CopyrightNotice=Copyright 2024 ZonaRoja Studio. Todos los derechos reservados.
Description=Shooter de extracción táctica multijugador con mecánicas hardcore de supervivencia y gestión de inventario.
bShouldWindowPreserveAspectRatio=True
bUseBorderlessWindow=False
bStartInVR=False
bSupportPhone=False
bSupportTablet=False

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.UserInterfaceSettings]
; Escala de UI base para resolución 1080p
DefaultDesignTimePlayAreaWidth=1920
DefaultDesignTimePlayAreaHeight=1080
RenderFocusRule=NavigationOnly
bLoadWidgetsOnDedicatedServer=False
