; Configuración predeterminada del usuario para ZonaRoja
; Estos valores se copian al guardar por primera vez y el usuario puede modificarlos

[/Script/Engine.GameUserSettings]
; Versión de configuración para detectar cambios entre actualizaciones
Version=5

; Resolución de pantalla predeterminada
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
WindowPosX=-1
WindowPosY=-1

; Modo de pantalla: 0=Ventana, 1=Pantalla completa, 2=Ventana sin bordes
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1

; Framerate sin límite por defecto para monitores de alta frecuencia
bUseVSync=False
bUseDynamicResolution=False
FrameRateLimit=0.000000

; Calidad de escalabilidad de renderizado (0=Bajo, 1=Medio, 2=Alto, 3=Épico, 4=Cine)
sg.ResolutionQuality=100.000000
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3

; Volúmenes de audio predeterminados
AudioQualityLevel=0
MasterSoundVolume=1.000000
MusicVolume=0.800000
SFXVolume=1.000000
VoiceVolume=1.000000
AmbientVolume=0.900000

; Configuración de red
bLimitClientFrameRate=False
